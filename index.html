  if(t==="custom"){const food={name:String(d.get("name")).trim(),serv:String(d.get("serv")).trim(),kcal:num(d.get("kcal")),p:num(d.get("p")),c:num(d.get("c")),f:num(d.get("f"))};if(M.prefill?.n)food.n=scaledMicros(M.prefill.n);if(d.get("save")){S.custom=[food,...S.custom.filter(c=>c.name!==food.name)].slice(0,300);touch()}addEntry(food);$("#dlg").close();render()}
  if(t==="barcode"){const raw=String(d.get("code")||""),code=normalizeCode(raw);if(code)lookup(code);else setScan({state:"idle",typed:raw,msg:"That barcode is not valid. Check the digits and try again."})}
  if(t==="scan"){const code=M.scan.code,qty=num(d.get("qty")),food={name:String(d.get("name")).trim(),serv:String(d.get("serv")).trim(),kcal:num(d.get("kcal")),p:num(d.get("p")),c:num(d.get("c")),f:num(d.get("f")),barcode:code};const chosen=M.scan.food.bases.find(b=>b.id===d.get("basis"))||M.scan.food.bases[0];if(chosen?.n)food.n=scaledMicros(chosen.n);if(!(qty>0)||!food.name)return;if(d.get("save")){S.custom=[food,...S.custom.filter(c=>c.barcode!==code)].slice(0,300);touch()}addEntry(food,qty);$("#dlg").close();render()}
  if(t==="plan"){const u=d.get("unit"),off=d.get("coaching")==="off",h=num(d.get("height")),w=num(d.get("weight")),kg=u==="kg"?w:w/LB,was=S.demo;if(was)S={demo:false,profile:null,days:{},custom:[]};
    const old=S.profile||{},lastMode=old.mode&&old.mode!=="off"?old.mode:old.lastMode;
    S.profile=off?{...old,unit:u,mode:"off",lastMode,startKg:old.startKg||(kg>0?kg:undefined)}:{...old,unit:u,mode:old.mode==="off"?(old.lastMode||"coached"):old.mode,sex:d.get("sex"),age:num(d.get("age")),heightCm:u==="kg"?h:h*2.54,activity:num(d.get("activity")),goal:num(d.get("goal")),protein:num(d.get("protein")),startKg:old.startKg||kg};
    const hadWeight=weights().length>0,prev=latestTrend();if(w>0&&(was||!hadWeight||Math.abs(toUser(prev)-w)>.06)){day(today()).w=+kg.toFixed(3)}S.profile.plan=targets();setup=false;cursor=today();if(was){view="log"}touchAll();render();scrollTo(0,0)}});
$("#importFile").addEventListener("change",async ev=>{const file=ev.target.files[0];ev.target.value="";if(!file)return;try{const x=JSON.parse(await file.text());if(!x.profile?.plan||typeof x.days!=="object")throw 0;const days={};for(const[k,v]of Object.entries(x.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!v||!Array.isArray(v.foods))continue;days[k]={...(v.w>0?{w:num(v.w)}:{}),...(v.skip?{skip:true}:{}),...cleanDayExtras(v),foods:v.foods.slice(0,100).map(e=>({id:uid(),name:String(e.name).slice(0,100),serv:String(e.serv||"").slice(0,50),qty:num(e.qty,1)||1,meal:MEALS.includes(e.meal)?e.meal:"Snacks",kcal:num(e.kcal),p:num(e.p),c:num(e.c),f:num(e.f),...(cleanN(e.n)?{n:cleanN(e.n)}:{})}))}}
  S={demo:false,profile:x.profile,days:{...S.days,...days},custom:Array.isArray(x.custom)?x.custom.slice(0,300):S.custom};touchAll();render()}catch(e){setSave("That file is not a Tare export.")}});
addEventListener("hashchange",()=>{route();render()});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(view==="trends")drawCharts()},150)});
{const dlg=$("#dlg"),nativeClose=dlg.close.bind(dlg);dlg.close=(...args)=>{stopScan();nativeClose(...args)};dlg.addEventListener("cancel",()=>stopScan());dlg.addEventListener("close",()=>stopScan())}
addEventListener("pagehide",()=>stopScan());
// Keep the add-food window above the keyboard and matched to the current fold state.
function syncViewport(){const v=window.visualViewport;if(!v)return;const s=document.documentElement.style;s.setProperty("--app-h",Math.round(v.height)+"px");s.setProperty("--vv-top",Math.round(v.offsetTop)+"px")}
if(window.visualViewport){visualViewport.addEventListener("resize",syncViewport);visualViewport.addEventListener("scroll",syncViewport);addEventListener("orientationchange",syncViewport);syncViewport()}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&M&&["live","starting"].includes(M.scan?.state)){stopScan();setScan({state:"idle"})}});
load();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(()=>{if(view==="plan")showOffline()}).catch(e=>{swError=`${e?.name||"Error"}: ${e?.message||""}`;if(view==="plan")showOffline()}));
